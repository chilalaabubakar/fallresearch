[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topside"
version = "0.1.0"
description = "Flexible topside power demand on an offshore platform supplied by offshore wind and a gas turbine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "xarray",
    "netCDF4",
    "cdsapi>=0.7.2",
    "neqsim",
    "pyomo",
    "highspy",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
