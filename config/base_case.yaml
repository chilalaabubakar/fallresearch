# Base case: generic North Sea platform near Tampen.
#
# Every physical parameter is written as
#   name: {value: ..., unit: ..., source: ...}
# Units are SI (m, s, W, kg, Sm3) unless the unit field says otherwise.
# A source starting with "ASSUMPTION" is a placeholder that still needs a
# literature reference or a sensitivity run before it goes into the paper.

site:
  name: Tampen area, northern North Sea
  latitude:  {value: 61.0, unit: deg_N, source: "Project definition; near Snorre/Gullfaks and Hywind Tampen"}
  longitude: {value: 2.0,  unit: deg_E, source: "Project definition"}
  year:      {value: 2023, unit: "-",   source: "Project definition; one full calendar year of hourly data"}

wind:
  era5:
    dataset: reanalysis-era5-single-levels
    variables: [100m_u_component_of_wind, 100m_v_component_of_wind]
    raw_dir: data/raw/era5
    reference_height: {value: 100.0, unit: m, source: "ERA5 100 m wind components (Hersbach et al., 2020, QJRMS 146:1999-2049)"}

  height_correction:
    method: power_law
    hub_height: {value: 150.0, unit: m, source: "IEA-15-240-RWT hub height (Gaertner et al., 2020, NREL/TP-5000-75698)"}
    shear_exponent: {value: 0.11, unit: "-", source: "Hsu, Meindl & Gilhousen (1994), J. Appl. Meteorol. 33:757-765, near-neutral conditions at sea"}

  turbine:
    name: IEA-15-240-RWT
    power_curve_file: data/turbines/iea_15mw_power_curve.csv
    rated_power: {value: 15.0e6, unit: W, source: "Gaertner et al. (2020)"}
    cut_in_speed:  {value: 3.0,  unit: m/s, source: "Gaertner et al. (2020)"}
    cut_out_speed: {value: 25.0, unit: m/s, source: "Gaertner et al. (2020)"}

  farm:
    n_turbines: {value: 2, unit: "-", source: "Base case choice: 30 MW installed, same order as the 32 MW wind farm of the LEOGO reference platform (Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)); varied in sensitivity"}
    n_turbines_sensitivity: {value: [1, 2, 3, 4], unit: "-", source: "Sensitivity range, 15-60 MW installed"}
    # Loss factors, applied as multipliers (1 - loss).
    wake_loss:       {value: 0.05, unit: "-", source: "ASSUMPTION: small cluster of 2 turbines; verify against literature"}
    electrical_loss: {value: 0.02, unit: "-", source: "ASSUMPTION: short subsea cable to platform; verify against literature"}
    availability:    {value: 0.95, unit: "-", source: "ASSUMPTION: typical offshore availability; verify against literature"}

  output:
    processed_file: data/processed/wind_farm_power_{year}.csv
    figure_file: results/figures/wind_farm_power_{year}.png

fuel_gas:
  # Standard conditions for Sm3 (Norwegian petroleum practice; ISO 13443).
  standard_temperature: {value: 288.15,    unit: K,  source: "ISO 13443 standard reference conditions (15 degC)"}
  standard_pressure:    {value: 101325.0,  unit: Pa, source: "ISO 13443 standard reference conditions"}
  # Mole fractions; must sum to 1. Names are NeqSim component names.
  composition:
    value: {nitrogen: 0.01, CO2: 0.02, methane: 0.84, ethane: 0.07, propane: 0.035,
            i-butane: 0.007, n-butane: 0.008, i-pentane: 0.005, n-pentane: 0.005}
    unit: mol/mol
    source: "ASSUMPTION: generic lean North Sea fuel gas; gives LHV 39.0 MJ/Sm3 vs 40 MJ/Sm3 used in LEOGO (Svendsen et al., 2023). No public field composition found"
  # LHV is computed from the composition with NeqSim (ISO 6976), not entered here.
  co2_emission_factor:
    value: 2.34
    unit: kg_CO2/Sm3
    source: "LEOGO reference platform gas carrier co2_content = 2.34 kg/Sm3, citing Statistics Norway (SSB) 2016 (Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)). Cross-checked in code against the carbon balance of the composition."

gas_turbine:
  # Part-load model: Willans line, i.e. fuel power is linear in electric power:
  #   Q_fuel = P_rated/eta_rated * (a + (1 - a) * L),   L = P / P_rated
  # so eta(L) = eta_rated * L / (a + (1 - a) * L).
  # a = no-load fuel as a fraction of full-load fuel.
  part_load_method: willans   # or "table" (relative efficiency vs load from CSV)
  part_load_table_file: data/turbines/gt_part_load_table.csv
  units:
    main:
      # LEOGO fuel model: fuel_energy / P_max = B * on + A * P / P_max, with A = 2.35, B = 0.53
      #   -> rated efficiency 1/(A+B) = 0.347, no-load fuel fraction B/(A+B) = 0.184
      name: LEOGO reference gas turbine
      rated_power: {value: 21.8e+6, unit: W, source: "Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
      rated_efficiency: {value: 0.3472, unit: "-", source: "1/(A+B) with A = 2.35, B = 0.53 from Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
      no_load_fuel_fraction: {value: 0.184, unit: "-", source: "B/(A+B) with A = 2.35, B = 0.53 from Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
      min_load: {value: 0.161, unit: "-", source: "3.5 MW minimum of 21.8 MW, Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
      n_installed: {value: 3, unit: "-", source: "Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
      heat_recovery_efficiency: {value: 0.5, unit: "-", source: "Share of (fuel - electricity) recovered as useful heat, eta_heat in Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
    small:
      # Solar Turbines Mars 100 generator set (oil and gas power generation package), ISO rating
      name: Solar Turbines Mars 100
      rated_power: {value: 11.35e+6, unit: W, source: "Solar Turbines, Mars 100 oil and gas power generation package: 11,350 kWe at ISO conditions (https://www.solarturbines.com/en_US/products/oil-and-gas-power-generation-packages/mars-100.html, accessed 27 October 2026)"}
      rated_efficiency: {value: 0.3292, unit: "-", source: "3600/10935 from the ISO heat rate of 10,935 kJ/kWe-h (10,365 Btu/kWe-h) at the generator terminals, Solar Turbines Mars 100 product page"}
      no_load_fuel_fraction: {value: 0.184, unit: "-", source: "ASSUMPTION: same relative part-load shape as the LEOGO turbine (Svendsen et al., 2023); no OEM part-load curve published"}
      min_load: {value: 0.161, unit: "-", source: "ASSUMPTION: same minimum-load fraction as the LEOGO turbine (Svendsen et al., 2023), i.e. 1.8 MW"}
      n_installed: {value: 1, unit: "-", source: "Fleet sensitivity: one small unit"}
      heat_recovery_efficiency: {value: 0.5, unit: "-", source: "Same as LEOGO turbine (Svendsen et al., 2023)"}
  low_load_threshold: {value: 0.50, unit: "-", source: "ASSUMPTION: load fraction below which a GT hour is counted as low-load (inefficient)"}
  min_units_running: {value: 2, unit: "-", source: "ASSUMPTION: N+1 redundancy common on Norwegian platforms; fixed per case later"}
  spinning_reserve: {value: 5.0e+6, unit: W, source: "el_reserve_margin = 5 MW in Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}

  output:
    figure_file: results/figures/gas_turbine_part_load.png

process:
  # Generic North Sea oil platform. Steady-state operating points only.
  # Field units (Sm3/d, bara, degC, MW) are converted to SI when loaded.
  reservoir_fluid:
    # Hydrocarbon well stream, mole basis (any scale). Water is handled separately.
    # TBP fractions: [moles, molar mass kg/mol, density g/cm3 at 15 degC]
    components:
      value: {nitrogen: 0.5, CO2: 1.5, methane: 45.0, ethane: 6.0, propane: 4.0,
              i-butane: 0.8, n-butane: 1.8, i-pentane: 0.7, n-pentane: 0.9, n-hexane: 1.0}
      unit: mol (relative)
      source: "ASSUMPTION: generic North Sea black oil, GOR about 180 Sm3/Sm3; replace with a published field fluid"
    tbp_fractions:
      value: {C7: [2.5, 0.0913, 0.746], C8: [2.5, 0.1041, 0.768], C10: [4.0, 0.135, 0.790],
              C15: [6.0, 0.206, 0.832], C20: [5.0, 0.282, 0.856], C30: [6.0, 0.400, 0.880]}
      unit: "[mol (relative), kg/mol, g/cm3]"
      source: "ASSUMPTION: generic heavy-end split; replace with a published field fluid"

  design:
    oil_rate:        {value: 15000.0, unit: Sm3/d, source: "ASSUMPTION: mid-size North Sea platform, plateau rate"}
    water_cut:       {value: 0.40,    unit: "-",   source: "ASSUMPTION: water fraction of produced liquid at standard conditions"}
    water_injection_rate: {value: 25000.0, unit: Sm3/d, source: "ASSUMPTION: roughly voidage replacement"}
    well_temperature: {value: 70.0,  unit: degC, source: "ASSUMPTION: arrival temperature at the inlet separator"}

  pressures:
    separators: {value: [70.0, 29.0, 7.2, 1.8], unit: bara, source: "Nguyen et al. (2013), Energy 62:23-36, Table 1: separation train at 7 / 2.9 / 0.72 / 0.18 MPa (generic North Sea platform). Last stage 1.7-2.8 bar on four real North Sea platforms (Voldsund et al. (2014), Energy 74:45-58, Table 2)"}
    gas_export:     {value: 180.0, unit: bara, source: "Voldsund et al. (2014), Energy 74:45-58, Table 2: treated gas at 179 bar on platform D (236, 118 and 184 bar on A-C); Nguyen et al. (2013), Table 1: gas export 18.5 MPa. LEOGO uses 200 bar (sensitivity)"}
    oil_export:     {value: 50.0,  unit: bara, source: "5 MPa oil export pressure, Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
    water_injection: {value: 250.0, unit: bara, source: "25 MPa injection pressure, Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
    wi_suction:     {value: 7.0,   unit: bara, source: "0.7 MPa water deck pressure, Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
    seawater_lift:  {value: 10.4,  unit: bar,  source: "0.1 -> 1.14 MPa incl. 40 m lift, Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}

  cooling:
    gas_cooler_outlet: {value: 30.0, unit: degC, source: "ASSUMPTION: scrubber inlet temperature"}
    seawater_temperature_rise: {value: 10.0, unit: K, source: "ASSUMPTION: typical cooling-water design"}
    seawater_cp: {value: 3.99, unit: kJ/kg/K, source: "Sharqawy, Lienhard & Zubair (2010), Desalin. Water Treat. 16:354-380; salinity 35 g/kg, 10-20 degC"}
    seawater_density: {value: 1026.0, unit: kg/m3, source: "Sharqawy, Lienhard & Zubair (2010); salinity 35 g/kg, about 15 degC"}

  efficiencies:
    # LEOGO efficiencies relate electric power to fluid power directly, so no
    # separate motor loss is applied (motor_and_drive = 1).
    compressor_isentropic: {value: 0.75, unit: "-", source: "Isentropic efficiency of export and re-compressors, Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
    water_pump:            {value: 0.75, unit: "-", source: "Water injection and seawater lift pumps, Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
    oil_export_pump:       {value: 0.60, unit: "-", source: "Oil export pump, Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
    motor_and_drive:       {value: 1.0,  unit: "-", source: "Included in the LEOGO efficiencies above"}

  # Part-load behaviour of each consumer (applied on top of NeqSim results):
  #   n_trains: identical parallel trains; trains can be switched off at low flow
  #   min_flow: minimum flow per train as fraction of train design flow
  #             (anti-surge recycle for compressors, minimum-flow recirculation for pumps).
  #             Below it the train recycles and draws min_flow power.
  consumers:
    recompression:     {n_trains: 1, min_flow: {value: 0.70, unit: "-", source: "ASSUMPTION: surge margin; no public value found; verify"}}
    export_compressor: {n_trains: 2, min_flow: {value: 0.70, unit: "-", source: "ASSUMPTION: surge margin; no public value found; verify"}}
    oil_export_pump:   {n_trains: 2, min_flow: {value: 0.30, unit: "-", source: "ASSUMPTION: pump minimum continuous flow; no public value found; verify"}}
    water_injection_pump: {n_trains: 3, min_flow: {value: 0.30, unit: "-", source: "ASSUMPTION: pump minimum continuous flow; no public value found; verify"}}
    seawater_lift_pump: {n_trains: 3, min_flow: {value: 0.30, unit: "-", source: "ASSUMPTION: pump minimum continuous flow; no public value found; verify"}}

  base_load: {value: 3.5, unit: MW, source: "2.5 MW general electric load + 1.0 MW air compressors, Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml)"}
  heat_demand: {value: 3.0, unit: MW, source: "Process/utility heat demand (thermal), Svendsen et al. (2023), LEOGO reference platform, IET Energy Syst. Integr., doi:10.1049/esi2.12085; dataset Zenodo 7373223 (values read from oogeso/tests/test_data/leogo_reference_platform.yaml); met by GT waste heat or an electric heater"}

  output:
    table_file: data/processed/process_power_table.csv
    figure_file: results/figures/process_power_vs_rate.png

flexibility:
  # Each consumer belongs to one class and is moved by one lever:
  #   must_run  - fixed power, never reduced
  #   flexible  - deferrable: energy use can be shifted in time, no loss if caught up
  #   sheddable - can be reduced, but the reduction is lost production
  classes:
    base_load: must_run
    water_injection_pump: flexible
    recompression: sheddable
    export_compressor: sheddable
    oil_export_pump: sheddable
    seawater_lift_pump: mixed   # cooling part follows production, make-up part follows injection

  production:
    # Lever for sheddable consumers: production rate as fraction of design.
    min_fraction: {value: 0.50, unit: "-", source: "ASSUMPTION: lowest stable production turndown (separator / well limits); verify"}
    max_fraction: {value: 1.00, unit: "-", source: "Design rate; no over-production to catch up"}
    ramp_rate:    {value: 0.10, unit: 1/h, source: "ASSUMPTION: max change in production fraction per hour (well choke / process stability); verify"}

  water_injection:
    # Lever for flexible consumers: injection rate as fraction of pump capacity (design).
    min_fraction: {value: 0.0,  unit: "-", source: "ASSUMPTION: all injection pumps may stop for short periods"}
    max_fraction: {value: 1.0,  unit: "-", source: "Installed pump capacity (design point)"}
    target_fraction: {value: 0.85, unit: "-", source: "ASSUMPTION: average injection needed for voidage replacement, as fraction of pump capacity"}
    ramp_rate:    {value: 0.34, unit: 1/h, source: "ASSUMPTION: about one of three pumps started/stopped per hour"}
    # Virtual storage: cumulative injection deficit, in hours of full-rate injection.
    # Deficit grows when injecting below target and must stay within [0, max_deficit].
    max_deficit:  {value: 72.0, unit: h, source: "ASSUMPTION: up to 3 days of full-rate injection may be postponed without significant reservoir pressure loss; key sensitivity"}

  output:
    table_file: results/tables/consumer_classification.csv
    figure_file: results/figures/consumer_flexibility.png

economics:
  # Currency: NOK (as in the LEOGO reference platform)
  oil_price: {value: 4190.0, unit: NOK/Sm3, source: "Oil export price in Svendsen et al. (2023), LEOGO reference platform"}
  gas_price: {value: 4.19,   unit: NOK/Sm3, source: "Gas export price in Svendsen et al. (2023), LEOGO; also the value of fuel gas burned instead of exported"}
  co2_price: {value: 2.0,    unit: NOK/kg_CO2, source: "NOK 2000/t: Norwegian target total CO2 price (tax + EU ETS) by 2030, Meld. St. 13 (2020-2021) Klimaplan 2021-2030; varied in sensitivity"}
  gt_start_cost: {value: 2000.0, unit: NOK, source: "penalty_start in Svendsen et al. (2023), LEOGO"}
  unserved_energy_cost: {value: 1.0e+6, unit: NOK/MWh, source: "Modelling choice: feasibility penalty, high enough that the 0.5 % MIP gap cannot leave demand unserved (LEOGO uses 36000 NOK/MWh for load shedding); should never be used"}
  reserve_shortfall_cost: {value: 1.0e+6, unit: NOK/MWh, source: "Modelling choice: same feasibility penalty as unserved energy; should never be used"}
  # Production expressed in oil equivalents for CO2 intensity (kg CO2 / Sm3 o.e.)
  gas_per_oil_equivalent: {value: 1000.0, unit: Sm3_gas/Sm3_oe, source: "Norwegian Offshore Directorate (Sodir) convention: 1000 Sm3 gas = 1 Sm3 oil equivalent"}

scheduler:
  window_hours:    {value: 168, unit: h, source: "Modelling choice: one week committed per solve"}
  lookahead_hours: {value: 24,  unit: h, source: "Modelling choice: extra day solved but not committed, so end-of-week decisions are sensible"}
  mip_gap:         {value: 0.005, unit: "-", source: "Modelling choice: solver stops within 0.5 % of the proven optimum"}
  time_limit:      {value: 120, unit: s, source: "Modelling choice: per weekly solve"}
  min_gt_online:   {value: 1, unit: "-", source: "ASSUMPTION: wind turbines are grid-following; at least one GT online for frequency/voltage control (as on Hywind Tampen platforms)"}
  electric_heater_efficiency: {value: 0.99, unit: "-", source: "ASSUMPTION: resistive electric heater"}
  heater_tiebreak_cost: {value: 0.1, unit: NOK/MWh, source: "Modelling choice: tiny cost so surplus wind is curtailed rather than dumped in the heater; does not change real decisions"}
  battery:
    # Size is set per case (case 4) and in the sensitivity analysis; 0 = no battery.
    power:  {value: 0.0, unit: W,  source: "Set per case; LEOGO option is 4 MW / 4 MWh (Svendsen et al., 2023)"}
    energy: {value: 0.0, unit: J,  source: "Set per case; LEOGO option is 4 MW / 4 MWh (Svendsen et al., 2023)"}
    round_trip_efficiency: {value: 0.9, unit: "-", source: "eta = 0.9 in Svendsen et al. (2023), LEOGO"}
    reserve_duration: {value: 1800.0, unit: s, source: "reserve_storage_minutes = 30 in Svendsen et al. (2023), LEOGO: stored energy must sustain the reserve for 30 min"}
  output:
    results_file: results/schedules/schedule_{case}.csv
    figure_file: results/figures/schedule_{case}.png

cases:
  # Each case: wind on/off, flexible demand on/off, battery on/off and the GT fleet.
  # Cases 2-4 keep the existing GTs (retrofit, as for Hywind Tampen on Snorre/Gullfaks);
  # the optimiser decides how many run. A "small GT" fleet is tested as a sensitivity.
  gt_only:           {label: "1 Gas turbines only",      wind: false, flexible: false, battery: false, fleet: {main: 3}}
  wind_fixed:        {label: "2 Wind, fixed demand",     wind: true,  flexible: false, battery: false, fleet: {main: 3}}
  wind_flex:         {label: "3 Wind, flexible demand",  wind: true,  flexible: true,  battery: false, fleet: {main: 3}}
  wind_flex_battery: {label: "4 Wind, flexible + battery", wind: true, flexible: true, battery: true,  fleet: {main: 3}}
  battery_size:
    power:  {value: 4.0, unit: MW,  source: "LEOGO battery option 4 MW / 4 MWh (Svendsen et al., 2023)"}
    energy: {value: 4.0, unit: MWh, source: "LEOGO battery option 4 MW / 4 MWh (Svendsen et al., 2023)"}

sensitivity:
  # Each run overrides base-case values. Override keys understood by cases.py:
  #   n_turbines, co2_price [NOK/kg], gas_price [NOK/Sm3], battery [MW, MWh],
  #   min_gt_online, max_deficit [h], fleet {unit: count}
  wind_farm_size:
    cases: [wind_fixed, wind_flex]
    runs: [{n_turbines: 1}, {n_turbines: 2}, {n_turbines: 3}, {n_turbines: 4}]
    source: "Sensitivity range, 15-60 MW installed (modelling choice)"
  co2_price:
    cases: [wind_flex]
    runs: [{co2_price: 0.5}, {co2_price: 1.0}, {co2_price: 2.0}, {co2_price: 3.0}]
    source: "Sensitivity range NOK 500-3000/t (modelling choice; base NOK 2000/t)"
  gas_price:
    cases: [wind_flex]
    runs: [{gas_price: 2.0}, {gas_price: 4.19}, {gas_price: 8.0}]
    source: "Sensitivity range NOK 2-8/Sm3 (modelling choice; base LEOGO 4.19)"
  battery_size:
    cases: [wind_flex_battery]
    runs: [{battery: [0, 0]}, {battery: [2, 2]}, {battery: [4, 4]}, {battery: [8, 8]}, {battery: [8, 16]}]
    source: "Sensitivity range 0-8 MW, 1-2 h storage (modelling choice)"
  injection_deficit:
    cases: [wind_flex]
    runs: [{max_deficit: 0}, {max_deficit: 24}, {max_deficit: 72}, {max_deficit: 168}]
    source: "Sensitivity on the most uncertain flexibility limit; 0 h = no injection flexibility"
  min_gt_online:
    cases: [wind_flex_battery]
    runs: [{min_gt_online: 1, battery: [8, 8]}, {min_gt_online: 0, battery: [8, 8]}]
    source: "Tests whether a grid-forming battery (8 MW / 8 MWh) could allow all GTs off"
  gt_fleet:
    cases: [wind_fixed, wind_flex]
    runs: [{fleet: {main: 3}}, {fleet: {main: 2, small: 1}}, {fleet: {main: 3, small: 1}}]
    source: "Retrofit (3 existing LEOGO GTs) vs replacing one by a small Solar Mars 100 (11.35 MW), or adding one small unit to the three existing GTs"
  gt_operation_practice:
    cases: [wind_fixed, wind_flex]
    runs: [{min_gt_online: 2}]
    source: "Keeps 2 GTs online whatever the wind (redundancy practice); compare CO2 avoided per wind MWh with Hywind Tampen's about 0.52 t/MWh"

validation:
  # Benchmarks from public sources. Each has a value or a [low, high] range.
  # Point values count as agreeing within `tolerance`.
  tolerance: {value: 0.20, unit: "-", source: "Modelling choice: +/-20 % counts as agreement for single published values"}
  bbl_per_Sm3: {value: 6.2898, unit: bbl/Sm3, source: "Standard conversion, 1 Sm3 = 6.2898 bbl (Norwegian Offshore Directorate)"}
  field_data_file: data/validation/field_data.csv
  benchmarks:
    platform_power_voldsund:
      metric: design_power_MW
      value: [17.0, 30.0]
      unit: MW
      source: "Voldsund et al. (2014), Energy 74:45-58, Table 5: power input to the processing plants of three real North Sea oil platforms, 25 / 30 / 17 MW (A, C, D; B is a gas-condensate platform, 5.5 MW). Platform A is the platform of Voldsund et al. (2013), Energy 55:716-727: about 24 MW for processing and about 34 MW for the whole platform"
      note: "Real platform with different production rates"
    platform_power_nguyen:
      metric: design_power_MW
      value: [22.6, 31.1]
      unit: MW
      source: "Nguyen et al. (2013), Energy 62:23-36, Table 6 and text: platform power consumption 22.6-31.1 MW over six North Sea reservoir-fluid cases"
      note: "Modelled platforms; upper end includes gas lift / injection"
    platform_power_castberg:
      metric: design_power_MW
      value: 25.0
      unit: MW
      source: "Johan Castberg PDO part II impact assessment: about 25 MW average, 50 MW peak (via search summary; verify)"
      note: "FPSO in the Barents Sea with gas re-injection"
    platform_power_hywind_tampen:
      metric: design_power_MW
      value: 25.1
      unit: MW
      source: "Implied: 384 GWh/yr expected from Hywind Tampen covers about 35 % of the electricity of 5 platforms (Snorre A/B, Gullfaks A/B/C) -> 384/0.35/8760/5 = 25.1 MW per platform (SNL; Equinor)"
      note: "Average over five mature platforms; rough"
    wind_capacity_factor_tampen_design:
      metric: wind_capacity_factor
      value: 0.498
      unit: "-"
      source: "Hywind Tampen expected 384 GWh/yr from 88 MW (SNL, Hywind Tampen) -> 0.498"
      note: "8 MW turbines, 80+ m hub; our model uses 15 MW at 150 m"
    wind_capacity_factor_tampen_q1_2025:
      metric: wind_capacity_factor
      value: 0.584
      unit: "-"
      source: "Equinor via Norwegian Offshore Wind: 58.4 % capacity factor in Q1 2025 (winter quarter)"
      note: "Winter quarter only, so higher than the annual value"
    co2_avoided_per_wind_mwh:
      metric: co2_avoided_t_per_MWh
      value: 0.52
      unit: t/MWh
      source: "Hywind Tampen: about 200 kt CO2/yr avoided (Equinor FID) for 384 GWh/yr expected (SNL) -> 0.52 t/MWh"
      note: "Strongest check: tests wind, GT part-load fuel, CO2 factor and scheduling together"
    co2_avoided_per_wind_mwh_2gt:
      metric: co2_avoided_t_per_MWh_2gt
      value: 0.52
      unit: t/MWh
      source: "Same Hywind Tampen benchmark (200 kt / 384 GWh), compared with the model run that keeps 2 GTs online (sensitivity gt_operation_practice)"
      note: "Like-for-like: Hywind Tampen's estimate assumes the same GTs keep running at lower load"
    co2_intensity_ncs_2023:
      metric: co2_intensity_kg_per_boe
      value: 7.3
      unit: kg/boe
      source: "Offshore Norge climate and environmental report 2024: NCS average 7.3 kg CO2/boe in 2023"
      note: "Average incl. flaring, diesel, gas-field compression and electrified fields"
    co2_intensity_non_electrified:
      metric: co2_intensity_kg_per_boe
      value: 10.5
      unit: kg/boe
      source: "Westwood Global Energy (2022 estimate): about 10.5 kg CO2/boe for non-electrified NCS hubs"
      note: "Estimate; includes flaring and late-life fields"
    leogo_water_injection:
      metric: wi_specific_energy_kWh_per_m3
      value: 8.99
      unit: kWh/m3
      source: "LEOGO: 8.97 MW for 0.277 m3/s at 0.7 -> 25 MPa, eta 0.75 (Svendsen et al., 2023; leogo_resultobject.json in Oogeso)"
      note: "Same pressures and efficiency, so this checks the NeqSim pump calculation"
  output:
    table_file: results/validation/validation_table.csv
    figure_file: results/validation/validation.png
